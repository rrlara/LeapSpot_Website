
<!DOCTYPE html>
<html lang="en">
<head>
  <title>My 2013 Travels</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive travel map following Rene and Rebecca through Mexico and Southeast Asia with photos and notes." />
  <meta property="og:title" content="My 2013 Travels" />
  <meta property="og:description" content="Explore geotagged travel moments in Mexico and Southeast Asia." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="styles.css?v=story-timeline-1" />
</head>
<body>
  <div id="map"></div>
  <button id="sidebar-open" type="button" aria-controls="infoback" aria-label="Open trip controls">Trips</button>
  <div id='infoback'>
    <div id="sidebar-header">
      <div>
        <p class="sidebar-kicker">Journey Map</p>
        <h1>Traveling</h1>
      </div>
      <button id="sidebar-close" type="button" aria-controls="infoback" aria-label="Hide trip controls">Hide</button>
    </div>
    <div id="dataset-panel">
      <p class="control-label">Trip</p>
      <div id="map-top-panel" class="dataset-toggle" role="group" aria-label="Choose trip dataset">
        <button id="individualPlot" class="dataset-option active1" type="button" aria-label="Show Southeast Asia route">
          Southeast Asia
        </button>
        <button id="districtLevel" class="dataset-option" type="button" aria-label="Show Mexico route">
          Mexico
        </button>
      </div>
    </div>
    <div id='info'>
    <p>
      Follow Rene & Rebecca through Mexico and Southeast Asia. Pick a stop from the timeline to move through the route, open photos, and explore the trip in order.
    </p>
    <p class="disclaimer">
      
    </p></div>
    <div id="timeline-panel">
      <div class="panel-heading-row">
        <h2>Trip Timeline</h2>
        <button id="fit-trip" class="panel-action" type="button">Fit trip</button>
      </div>
      <div id="timeline-controls" class="timeline-controls" aria-label="Timeline controls">
        <button id="timeline-prev" type="button">Previous</button>
        <button id="timeline-next" type="button">Next</button>
      </div>
      <p id="timeline-count" class="timeline-count">Loading stops...</p>
      <div id="timeline-list" role="list" aria-label="Trip timeline"></div>
    </div>
    <div id="search-panel">
      <h2>Search Trips</h2>
      <input id="search-comment" type="text" placeholder="Search comments..." aria-label="Search comments" />
      <div class="search-row">
        <label for="filter-region">Region</label>
        <select id="filter-region" aria-label="Filter by region">
          <option value="all">All</option>
          <option value="sea">Southeast Asia</option>
          <option value="mexico">Mexico</option>
        </select>
      </div>
      <div class="search-row">
        <label for="filter-from">From</label>
        <input id="filter-from" type="date" aria-label="From date" />
      </div>
      <div class="search-row">
        <label for="filter-to">To</label>
        <input id="filter-to" type="date" aria-label="To date" />
      </div>
      <p id="search-count">0 results</p>
      <div id="search-results" role="list" aria-label="Search results"></div>
    </div>
    <div id="map-panel">
      <h2>Basemap</h2>
      <div class="basemap-grid">
        <div id="aerial" class="mapicons" role="button" tabindex="0" aria-label="Switch to aerial basemap">Aerial</div>
        <div id="darkCanvas" class="mapicons" role="button" tabindex="0" aria-label="Switch to dark basemap">Dark</div>
        <div id="streets" class="mapicons activeicon" role="button" tabindex="0" aria-label="Switch to streets basemap">Streets</div>
        <div id="terrain" class="mapicons" role="button" tabindex="0" aria-label="Switch to terrain basemap">Terrain</div>
      </div>
    </div>
    <p id="status-message" class="status-message" aria-live="polite"></p>
  </div>
  <div id="image-viewer" aria-hidden="true">
    <button id="image-viewer-close" type="button" aria-label="Close fullscreen image">Exit</button>
    <img id="image-viewer-img" alt="Fullscreen travel photo" />
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="Map.js?v=story-timeline-1" type="text/javascript"></script>
  <script src="app.js?v=story-timeline-1" type="text/javascript"></script>
</body>
</html>
